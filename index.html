<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello GitHub!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background: linear-gradient(135deg, #f6f8fa 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #24292f;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid #d0d7de;
        }
        .avatar {
            font-size: 54px;
            margin-bottom: 16px;
            display: inline-block;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #0969da;
            margin-bottom: 16px;
        }
        .intro {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #57606a;
            margin-bottom: 24px;
        }
        .tag {
            display: inline-block;
            background-color: #ddf4ff;
            color: #0969da;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">👋</div>
        <h1>Hello GitHub!</h1>
        <p class="intro">
            你好！这是一份简短的自我介绍：我是一名热爱编程与技术探索的开发者，正在通过 GitHub 开启我的代码与开源之旅。
        </p>
        <span class="tag">🌱 持续学习 · 探索未来</span>
    </div>
</body>
</html>
