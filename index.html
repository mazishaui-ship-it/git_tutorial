<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello GitHub! | 자기소개 · 自我介绍</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f6f8fa 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: #24292f;
            line-height: 1.6;
        }
        .card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 44px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 1px solid #d0d7de;
        }
        .avatar {
            font-size: 52px;
            margin-bottom: 12px;
            display: inline-block;
        }
        .badge {
            display: inline-block;
            background-color: #ddf4ff;
            color: #0969da;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 14px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #0969da;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .sub-greeting {
            font-size: 1.05rem;
            font-weight: 600;
            color: #57606a;
            margin-bottom: 22px;
        }
        .intro-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px 18px;
            margin-bottom: 24px;
            text-align: left;
            border-left: 4px solid #0969da;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .lang-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .lang-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #0969da;
            letter-spacing: 0.5px;
        }
        .intro-text {
            font-size: 0.98rem;
            color: #24292f;
            line-height: 1.6;
            word-break: keep-all;
        }
        .tags-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tag {
            display: inline-block;
            background-color: #f3f4f6;
            color: #4b5563;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">👋</div>
        <div class="badge">자기소개 / 自我介绍</div>
        <h1>Hello GitHub!</h1>
        <p class="sub-greeting">반갑습니다! / 欢迎来到我的个人主页！</p>

        <!-- 한중 병기 자기소개 (Korean-Chinese Bilingual Introduction) -->
        <div class="intro-section">
            <div class="lang-item">
                <span class="lang-label">🇰🇷 한국어 (Korean)</span>
                <p class="intro-text">
                    안녕하세요! 프로그래밍과 새로운 기술 탐색을 좋아하는 개발자입니다. GitHub를 통해 저의 코드와 오픈소스 여정을 시작합니다.
                </p>
            </div>
            <div class="lang-item">
                <span class="lang-label">🇨🇳 中文 (Chinese)</span>
                <p class="intro-text">
                    你好！我是一名热爱编程与技术探索的开发者，正在通过 GitHub 开启我的代码与开源之旅。
                </p>
            </div>
        </div>

        <div class="tags-container">
            <span class="tag">🌱 지속적인 배움 / 持续学习</span>
            <span class="tag">🚀 새로운 탐색 / 探索未来</span>
        </div>
    </div>
</body>
</html>
