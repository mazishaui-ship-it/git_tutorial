    <meta charset="UTF-8">
    <title>나의 취미 소개</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #2c3e50;
        }
    </style>

<body>
    <h1>나의 취미: 산책과 음악 감상</h1>
    <p>저는 여가 시간에 산책을 하면서 음악 듣는 것을 좋아합니다.</p>
    <p>산책을 하면 스트레스를 풀 수 있고, 자연을 보면서 마음이 편안해집니다.</p>
    <p>좋아하는 음악을 같이 들으면 기분이 더 좋아집니다.</p>
    <ul>
        <li>좋아하는 음악 장르: 발라드, 인디 음악</li>
        <li>주로 가는 곳: 공원, 조용한 거리</li>
    </ul>
</body>

</html>
