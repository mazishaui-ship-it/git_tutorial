<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>나의 취미 - 我的爱好</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #2c3e50;
        }
    </style>
</head>

<body>
    <h1>나의 취미: 산책과 음악 감상 / 我的爱好：散步与听音乐</h1>
    <p>저는 여가 시간에 산책을 하면서 음악 듣는 것을 좋아합니다。/ 我闲暇的时候喜欢一边散步一边听音乐。</p>
    <p>산책을 하면 스트레스를 풀 수 있고, 자연을 보면서 마음이 편안해집니다。/ 散步可以缓解压力，欣赏风景，让心情放松。</p>
    <p>좋아하는 음악을 같이 들으면 기분이 더 좋아집니다。/ 配上喜欢的音乐，心情会更好。</p>
    <ul>
        <li>좋아하는 음악 장르: 발라드, 인디 음악 / 喜欢的音乐类型：抒情歌、独立音乐</li>
        <li>주로 가는 곳: 공원, 조용한 거리 / 常去的地方：公园、安静的街道</li>
    </ul>
</body>

</html>
